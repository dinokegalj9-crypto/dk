<!DOCTYPE html>
<html lang="en" data-collection="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sensorium — The Threshold</title>
  <meta name="description" content="You have been here before. A memory, surfacing." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../../design-system/css/sensorium.css" />
  <link rel="stylesheet" href="./hero.css" />
</head>

<body>
  <!-- SVG heat-haze filter — applied to the clarity layer on desktop -->
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <filter id="hero-haze" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.014" numOctaves="2" seed="7" result="noise">
        <animate attributeName="baseFrequency" dur="24s" values="0.008 0.014;0.012 0.010;0.008 0.014" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <!-- Quiet global frame -->
  <nav class="veil-nav" aria-label="Primary">
    <a class="veil-nav__mark" href="#top">Sensorium</a>
    <button class="veil-nav__summon" aria-expanded="false" aria-label="Open menu"><span></span><span></span></button>
  </nav>

  <div class="threshold-stage" id="top">
    <!-- ================= THE SURFACING ================= -->
    <section class="threshold-hero" aria-label="Sensorium">
      <div class="hero__memory" aria-hidden="true"></div>
      <div class="hero__clarity" aria-hidden="true"></div>
      <div class="hero__grain" aria-hidden="true"></div>

      <div class="hero__inner">
        <p class="hero__eyebrow t-label">Sensorium</p>
        <h1 class="hero__word" data-text="You have been here before">You have been here before</h1>
        <p class="hero__line">Before the word for it. Before you could keep it.</p>
      </div>

      <button class="hero__descend" aria-label="Descend">
        <span class="t-label">go under</span>
        <span class="hero__descend__rail" aria-hidden="true"></span>
      </button>

      <div class="hero__shroud" aria-hidden="true"></div>
    </section>

    <!-- The state we submerge into (prototype context only) -->
    <section class="drift-next" aria-label="Drift">
      <p class="t-label" data-surface>Waking · No. 1</p>
      <h2 class="t-display t-memory glow-word" data-surface data-stagger="1">Undertow</h2>
      <p class="t-subhead" data-surface data-stagger="2" style="max-width:30ch;margin-inline:auto">
        The pull of water you can't see, deciding to let it take you.
      </p>
    </section>
  </div>

  <button class="sound-toggle" data-sound-toggle aria-pressed="false">
    <span class="sound-toggle__wave" aria-hidden="true"><i></i><i></i><i></i></span>
    Sound
  </button>

  <script src="../../design-system/js/sensorium.js"></script>
  <script src="./hero.js"></script>
</body>
</html>
